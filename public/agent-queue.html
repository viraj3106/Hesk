<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Queue - Helpdesk</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header>
      <div>
        <span class="logo">Helpdesk.IO</span>
      </div>
      <div class="user-nav">
        <span class="user-info" id="userEmail"></span>
        <span class="role-badge">Support Agent</span>
        <button class="btn btn-secondary" onclick="API.logout()">Sign Out</button>
      </div>
    </header>

    <!-- Stats Widgets -->
    <div class="stats-row" style="margin-bottom: 2rem;">
      <div class="stat-card">
        <h3>Assigned</h3>
        <div class="stat-number" id="statAssigned">0</div>
      </div>
      <div class="stat-card">
        <h3>In Progress</h3>
        <div class="stat-number" id="statInProgress">0</div>
      </div>
      <div class="stat-card">
        <h3>Resolved</h3>
        <div class="stat-number" id="statResolved">0</div>
      </div>
    </div>

    <div>
      <h2 style="margin-bottom: 1.5rem;">Your Assigned Tickets</h2>
      
      <div class="tabs">
        <button class="tab active" onclick="filterStatus('')">All</button>
        <button class="tab" onclick="filterStatus('assigned')">Assigned</button>
        <button class="tab" onclick="filterStatus('in_progress')">In Progress</button>
        <button class="tab" onclick="filterStatus('resolved')">Resolved</button>
        <button class="tab" onclick="filterStatus('closed')">Closed</button>
      </div>
 
      <div id="ticketList" class="ticket-list">
        <p style="color: var(--text-secondary);">Loading queue...</p>
      </div>
 
      <div class="pagination">
        <button class="btn btn-secondary" id="prevBtn" onclick="changePage(-1)">Previous</button>
        <span id="pageInfo" style="font-size: 0.95rem; color: var(--text-secondary);">Page 1 of 1</span>
        <button class="btn btn-secondary" id="nextBtn" onclick="changePage(1)">Next</button>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
    const session = API.getSession();
    if (!session || session.role !== 'agent') {
      window.location.href = 'index.html';
    }

    document.getElementById('userEmail').textContent = session.email;

    let currentStatus = '';
    let currentPage = 1;
    const limit = 20;

    async function loadQueue() {
      const ticketList = document.getElementById('ticketList');
      try {
        // Fetch all assigned tickets to calculate stats
        const allRes = await API.getAgentQueue('', 1, 1000);
        const allAssigned = allRes.data || [];
        const assignedCount = allAssigned.filter(t => t.status === 'assigned').length;
        const inProgressCount = allAssigned.filter(t => t.status === 'in_progress').length;
        const resolvedCount = allAssigned.filter(t => t.status === 'resolved').length;

        document.getElementById('statAssigned').textContent = assignedCount;
        document.getElementById('statInProgress').textContent = inProgressCount;
        document.getElementById('statResolved').textContent = resolvedCount;

        const response = await API.getAgentQueue(currentStatus, currentPage, limit);
        const tickets = response.data;
        const total = response.total;
        const totalPages = Math.ceil(total / limit) || 1;

        document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
        document.getElementById('prevBtn').disabled = currentPage === 1;
        document.getElementById('nextBtn').disabled = currentPage === totalPages;

        if (tickets.length === 0) {
          ticketList.innerHTML = `<p style="color: var(--text-secondary); text-align: center; padding: 2rem;">No tickets in queue.</p>`;
          return;
        }

        ticketList.innerHTML = tickets.map(ticket => `
          <a href="ticket-detail.html?id=${ticket.id}" class="ticket-item">
            <div class="ticket-info">
              <span class="ticket-title">${escapeHtml(ticket.title)}</span>
              <div class="ticket-meta">
                <span>#${ticket.id}</span>
                <span>Last Updated: ${new Date(ticket.updated_at).toLocaleString()}</span>
              </div>
            </div>
            <span class="status-badge status-${ticket.status}">${ticket.status.replace('_', ' ')}</span>
          </a>
        `).join('');
      } catch (err) {
        ticketList.innerHTML = `<p style="color: #ef4444;">Error loading queue: ${err.message}</p>`;
      }
    }

    function filterStatus(status) {
      currentStatus = status;
      currentPage = 1;
      
      const tabs = document.querySelectorAll('.tab');
      tabs.forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      
      loadQueue();
    }

    function changePage(delta) {
      currentPage += delta;
      loadQueue();
    }

    function escapeHtml(unsafe) {
      return unsafe
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    loadQueue();
  </script>
</body>
</html>
