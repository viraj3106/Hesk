<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Helpdesk Ticketing SaaS - Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container auth-wrapper">
    <div class="card" id="authCard">
      <div style="text-align: center; margin-bottom: 2rem;">
        <span class="logo" style="font-size: 2rem;">Helpdesk.IO</span>
      </div>
      
      <div id="loginFormSection">
        <h2>Welcome back</h2>
        <p>Sign in to manage your support tickets</p>
        
        <form id="loginForm">
          <div class="form-group">
            <label for="loginEmail">Email Address</label>
            <input type="email" id="loginEmail" placeholder="you@example.com" required>
          </div>
          
          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" placeholder="••••••••" required>
          </div>
          
          <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Sign In</button>
        </form>
        
        <p style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem;">
          Don't have an account? <a href="#" id="showSignup" style="color: var(--accent-primary); text-decoration: none; font-weight: 600;">Create one</a>
        </p>
      </div>

      <div id="signupFormSection" style="display: none;">
        <h2>Create an account</h2>
        <p>Get started by setting up your support profile</p>
        
        <form id="signupForm">
          <div class="form-group">
            <label for="signupName">Full Name</label>
            <input type="text" id="signupName" placeholder="John Doe" required>
          </div>

          <div class="form-group">
            <label for="signupEmail">Email Address</label>
            <input type="email" id="signupEmail" placeholder="you@example.com" required>
          </div>
          
          <div class="form-group">
            <label for="signupPassword">Password</label>
            <input type="password" id="signupPassword" placeholder="••••••••" required>
          </div>

          <div class="form-group">
            <label for="signupRole">I am a...</label>
            <select id="signupRole">
              <option value="customer">Customer (Request Support)</option>
              <option value="agent">Support Agent (Resolve Issues)</option>
            </select>
          </div>
          
          <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Create Account</button>
        </form>
        
        <p style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem;">
          Already have an account? <a href="#" id="showLogin" style="color: var(--accent-primary); text-decoration: none; font-weight: 600;">Sign in</a>
        </p>
      </div>
      
      <div id="authError" style="margin-top: 1rem; color: #ef4444; font-size: 0.9rem; text-align: center; display: none;"></div>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
    // Redirect if already logged in
    const session = API.getSession();
    if (session) {
      redirectUser(session.role);
    }

    function redirectUser(role) {
      if (role === 'admin') window.location.href = 'admin-dashboard.html';
      else if (role === 'agent') window.location.href = 'agent-queue.html';
      else window.location.href = 'customer-dashboard.html';
    }

    const showSignup = document.getElementById('showSignup');
    const showLogin = document.getElementById('showLogin');
    const loginSection = document.getElementById('loginFormSection');
    const signupSection = document.getElementById('signupFormSection');
    const authError = document.getElementById('authError');

    showSignup.addEventListener('click', (e) => {
      e.preventDefault();
      loginSection.style.display = 'none';
      signupSection.style.display = 'block';
      authError.style.display = 'none';
    });

    showLogin.addEventListener('click', (e) => {
      e.preventDefault();
      signupSection.style.display = 'none';
      loginSection.style.display = 'block';
      authError.style.display = 'none';
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      authError.style.display = 'none';
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      try {
        const data = await API.login(email, password);
        redirectUser(data.user.role);
      } catch (err) {
        authError.textContent = err.message;
        authError.style.display = 'block';
      }
    });

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      authError.style.display = 'none';
      const name = document.getElementById('signupName').value;
      const email = document.getElementById('signupEmail').value;
      const password = document.getElementById('signupPassword').value;
      const role = document.getElementById('signupRole').value;

      try {
        const data = await API.signup(name, email, password, role);
        redirectUser(data.user.role);
      } catch (err) {
        authError.textContent = err.message;
        authError.style.display = 'block';
      }
    });
  </script>
</body>
</html>
