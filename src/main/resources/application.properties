jwt.secret=${JWT_SECRET:c8ITUCkbAog3iDllgjn4dN4vBa4apSMSd6DiDr4f4N1DlhlvL/ztWOcq79ehy4t8AZ4ULvlchyNW1bFgkQV3Nw==}

# Datasource Configuration (Uses MySQL if host is provided, otherwise creates an embedded fast DB automatically)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/resolvedesk;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Multipart file sizes
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
